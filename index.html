*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg) var(--notes) repeat fixed;background-size:220px 220px;min-height:100vh;color:var(--ink);font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.display{font-family:"Karantina","Assistant",system-ui,sans-serif;font-weight:700;line-height:.95;letter-spacing:.01em}
#app{max-width:480px;margin:0 auto;padding:18px 18px 110px}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.brand .display{font-size:30px}
.brand small{color:var(--muted);font-size:14px}
h2{font-size:15px;font-weight:800;color:var(--muted);margin:28px 0 8px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:12px 20px;font-weight:800;background:var(--pink);color:var(--pink-ink);min-height:48px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.45}
.back{background:none;border:0;padding:8px 0;color:var(--muted);font-weight:600;min-height:44px}

/* round list */
.round{display:block;width:100%;text-align:right;background:var(--surface);border:0;border-radius:18px;padding:16px 18px;margin-bottom:10px;position:relative;overflow:hidden}
.round::before{content:"";position:absolute;inset:0 0 0 auto;width:6px;background:var(--c,var(--line))}
.round .display{font-size:34px;display:block;margin-bottom:6px}
.round .meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;background:var(--chip);color:var(--ink)}
.pill.pick{background:var(--pink);color:var(--pink-ink)}
.pill.rate{background:var(--mint);color:#0B2A1D}
.empty{text-align:center;padding:48px 8px}
.empty .display{font-size:44px;margin-bottom:10px}

/* round screen */
.topic{font-size:64px;margin:6px 0 18px;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps div{flex:1;text-align:center;font-size:13px;font-weight:800;padding:6px 0;border-radius:10px;background:var(--chip);color:var(--muted)}
.steps div.on{background:var(--ink);color:var(--bg)}
.steps div.past{color:var(--ink)}
.clock{font-size:15px;margin-bottom:18px}
.clock b{font-size:17px}
.panel{background:var(--surface);border-radius:20px;padding:18px}
label.f{display:block;font-size:14px;font-weight:800;margin:0 0 6px}
.field{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:17px}
.field:focus{border-color:var(--pink);outline:none}
textarea.field{min-height:92px;resize:none}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.mine{border:2px dashed var(--mint);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.row-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

.song{background:var(--surface);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.song .t{font-weight:800;font-size:19px;line-height:1.25}
.song .a{color:var(--muted);font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.links a{font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--chip);border-radius:999px;padding:6px 11px;min-height:32px;display:inline-flex;align-items:center}
.scale{margin-top:12px}
.scale span{font-size:14px;font-weight:800;display:block;margin-bottom:6px}
.dots{display:flex;gap:8px}
.dots button{flex:1;height:46px;border-radius:14px;border:2px solid var(--line);background:transparent;font-weight:800;font-size:18px}
.dots button.on{background:var(--pink);border-color:var(--pink);color:var(--pink-ink)}
.dots.fun button.on{background:var(--mint);border-color:var(--mint);color:#0B2A1D}
.song.self{opacity:.7;border:2px dashed var(--line);background:transparent}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -1px 0 var(--line);z-index:5}
.savebar .in{max-width:444px;margin:0 auto;display:flex;align-items:center;gap:12px}
.savebar .prog{font-size:14px;font-weight:700;flex:1}

.playlist{margin-top:8px}
.playlist .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}

/* results */
.res{display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.res .rk{font-family:"Karantina",system-ui,sans-serif;font-weight:700;font-size:34px;color:var(--muted);text-align:center}
.res.win .rk{color:var(--pink)}
.res .who{font-weight:800}
.res .sg{font-size:14px;color:var(--muted);line-height:1.3}
.res .pts{font-family:"Karantina",system-ui,sans-serif;font-weight:700;font-size:40px;line-height:1}
.res .sub{grid-column:2 / 4;display:flex;gap:14px;font-size:13px;color:var(--muted)}
.res .links{grid-column:1 / 4;margin:4px 0 0}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.award{background:var(--ink);color:var(--bg);border-radius:18px;padding:14px}
.award small{display:block;font-size:13px;opacity:.8;font-weight:700}
.award b{display:block;font-size:17px;line-height:1.25;margin-top:4px}

/* board */
.seg{display:flex;background:var(--chip);border-radius:999px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px;font-weight:800;min-height:44px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}
.lb{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.lb .rk{font-family:"Karantina",system-ui,sans-serif;font-weight:700;font-size:30px;width:30px;text-align:center;color:var(--muted)}

.lb .nm{flex:1;font-weight:800}
.lb .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.lb .p{font-family:"Karantina",system-ui,sans-serif;font-weight:700;font-size:34px}
.hero{background:var(--pink);color:var(--pink-ink);border-radius:22px;padding:20px;margin-bottom:14px}
.hero small{font-weight:700;opacity:.9}
.hero .display{font-size:52px;display:block;margin:4px 0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav .in{max-width:456px;margin:0 auto;display:flex;align-items:center;gap:8px}
.nav .tab{flex:1;border:0;background:none;padding:10px 0;font-weight:800;color:var(--muted);min-height:48px;border-radius:14px}
.nav .tab.on{color:var(--ink);background:var(--chip)}
.nav .add{flex:0 0 auto}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{border:0;background:var(--chip);border-radius:999px;padding:8px 12px;font-size:14px;text-align:right;min-height:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{background:var(--chip);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;z-index:20;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.topic{animation:drop .5s cubic-bezier(.2,.9,.3,1.2)}@keyframes drop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}}

.linkbtn{background:none;border:0;padding:4px 0;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);min-height:32px;text-align:right}
.res .who.linkbtn{font-weight:800;text-decoration:none;padding:0;min-height:0}
.chips button.on{background:var(--ink);color:var(--bg)}
.chips.guess{margin-bottom:0}
.chips.guess button{min-height:40px}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--pink)}
.legend{font-size:13px;color:var(--muted);margin:-6px 0 14px;line-height:1.6}
.qrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.qrow .qt{flex:1;font-weight:700;line-height:1.3}
.qrow .qt small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.qbtns{display:flex;gap:6px}
.qbtns button{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:transparent;font-size:14px}
.qbtns button:disabled{opacity:.3}
details.panel summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
button.lb{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:right}
button.lb:first-of-type .rk{color:var(--pink)}
.titles{display:grid;gap:8px}
.ttl{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:12px 14px}
.ttl .ic{font-size:28px;line-height:1}
.ttl b{display:block}
.ttl small{display:block;color:var(--muted);font-size:13px}
.ttl .holders{font-weight:800;color:var(--pink);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:14px}
.stat span{font-size:22px}
.stat b{display:block;font-family:"Karantina",system-ui,sans-serif;font-size:40px;line-height:1;margin-top:4px}
.stat small{color:var(--muted);font-size:13px;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 16px}
.badge{background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
</style>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u.trim())) ? u.trim() : '';
const now = () => Date.now();

const r1 = x => Math.round(x * 10) / 10;

function fmtLeft(ms) {

}
const fmtDate = t => new Date(t).toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' });

function dayId(d) { return 'd' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }

/* ---------- songs ---------- */
function ytId(u) { const m = (u || '').match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : null }
function songKeys(p) {
  const k = [], u = safeUrl(p.url);
  const y = ytId(u); if (y) k.push('yt:' + y);
  const sp = u.match(/spotify\.com\/(?:intl-[\w-]+\/)?track\/(\w+)/); if (sp) k.push('sp:' + sp[1]);
  const am = u.match(/[?&]i=(\d+)/); if (am && /apple\.com/.test(u)) k.push('am:' + am[1]);
  const norm = s => (s || '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  const t = norm(p.title); if (t) k.push('tx:' + t + '|' + norm(p.artist));

}

}

}

/* ---------- scoring ---------- */
function roundData(r) {
  const picks = S.picks.filter(p => p.rid === r.id);
  const by = {}, gs = {};
  S.ratings.filter(x => x.rid === r.id).forEach(x => { by[x.uid] = x.scores || {}; gs[x.uid] = x.guesses || {} });
  const pickers = new Set(picks.map(p => p.uid));
  const keyMap = {};
  picks.forEach(p => songKeys(p).forEach(k => (keyMap[k] = keyMap[k] || new Set()).add(p.uid)));
  const rows = picks.map(p => {
    const got = [];
    for (const [ru, sc] of Object.entries(by)) { if (ru === p.uid) continue; const v = sc[p.uid]; if (v && v.fit && v.fun) got.push(v) }
    const mine = by[p.uid] || {};
    const complete = picks.filter(q => q.uid !== p.uid).every(q => mine[q.uid] && mine[q.uid].fit && mine[q.uid].fun);
    const n = got.length;
    const fit = n ? got.reduce((a, v) => a + v.fit, 0) / n : 0, fun = n ? got.reduce((a, v) => a + v.fun, 0) / n : 0;
    const raw = r1(fit + fun);
    const hive = songKeys(p).some(k => keyMap[k].size > 1);
    let gRight = 0, gTot = 0;
    for (const [gu, g] of Object.entries(gs)) { if (gu === p.uid) continue; const v = g[p.uid]; if (v) { gTot++; if (v === p.uid) gRight++ } }
    return { ...p, n, fit, fun, raw, complete, pts: complete ? raw : 0, hive, gRight, gTot };
  });
  rows.sort((a, b) => b.pts - a.pts || b.raw - a.raw);
  const bonus = {}, made = {};
  for (const [gu, g] of Object.entries(gs)) {
    let c = 0, m = 0;
    for (const [pu, v] of Object.entries(g)) { if (pu === gu || !pickers.has(pu) || !v) continue; m++; if (v === pu) c++ }
    if (c) bonus[gu] = c; if (m) made[gu] = m;
  }
  return { rows, bonus, made, funny: funnyOf(r) };
}
const doneRounds = () => S.rounds.filter(r => phase(r) === 'done');
function aggregate(rounds) {
  const P = {};
  const g = u => P[u] || (P[u] = { uid: u, pts: 0, bonus: 0, wins: 0, played: 0, fitSum: 0, fitN: 0, funSum: 0, funN: 0, gMade: 0, gOnRight: 0, gOnTot: 0, hive: 0 });
  let flop = null;
  rounds.forEach(r => {
    const d = roundData(r);
    const top = d.rows.length && d.rows[0].pts > 0 ? d.rows[0].pts : null;
    d.rows.forEach(x => {
      const t = g(x.uid); t.pts += x.pts; t.played++;
      if (top !== null && x.pts === top) t.wins++;
      if (x.n) { t.fitSum += x.fit; t.fitN++; if (d.funny) { t.funSum += x.fun; t.funN++ } }
      t.gOnRight += x.gRight; t.gOnTot += x.gTot; if (x.hive) t.hive++;
      if (x.complete && x.n && (!flop || x.pts < flop.pts)) flop = { ...x, topic: r.topic };
    });
    Object.entries(d.bonus).forEach(([u, c]) => g(u).bonus += c);
    Object.entries(d.made).forEach(([u, c]) => g(u).gMade += c);
  });
  Object.values(P).forEach(t => { t.total = r1(t.pts + t.bonus); t.pts = r1(t.pts) });
  return { P, flop, count: rounds.length };
}
function maxBy(arr, f, cond) {
  let best = null, uids = [];
  arr.forEach(t => { if (!cond(t)) return; const v = f(t); if (best === null || v > best + 1e-9) { best = v; uids = [t.uid] } else if (Math.abs(v - best) < 1e-9) uids.push(t.uid) });
  return uids;
}
function titles() {
  const done = doneRounds(), ws = weekStart();
  const A = Object.values(aggregate(done).P), wk = aggregate(done.filter(r => r.rateEnds >= ws)), W = Object.values(wk.P);
  return [
    { ic: '👑', n: 'Weekly Champion', d: 'מקום ראשון השבוע', u: maxBy(W, t => t.total, t => t.total > 0) },
    { ic: '💀', n: 'Flop of the Week', d: wk.flop ? 'הכי מעט נקודות השבוע: ' + wk.flop.title : 'השיר עם הכי מעט נקודות השבוע', u: wk.flop ? [wk.flop.uid] : [] },
    { ic: '🐑', n: 'Hive Mind', d: 'בחרו אותו שיר כמו מישהו אחר השבוע', u: W.filter(t => t.hive > 0).map(t => t.uid) },
    { ic: '🎯', n: 'Sniper', d: 'ממוצע ההתאמה הכי גבוה', u: maxBy(A, t => t.fitSum / t.fitN, t => t.fitN > 0) },
    { ic: '🤡', n: 'Comedian', d: 'הכי הרבה נקודות מצחיק', u: maxBy(A, t => t.funSum, t => t.funSum > 0) },
    { ic: '🕵️', n: 'Unpredictable', d: 'הכי קשה לנחש את הבחירות שלו', u: maxBy(A, t => 1 - t.gOnRight / t.gOnTot, t => t.gOnTot >= 3) },
    { ic: '🔮', n: 'Mind Reader', d: 'הכי הרבה ניחושים נכונים', u: maxBy(A, t => t.bonus, t => t.bonus > 0) }
  ];
}
function streak(uid) {
  const rs = S.rounds.slice().sort((a, b) => b.createdAt - a.createdAt);
  let s = 0;
  for (const r of rs) {
    if (S.picks.some(p => p.rid === r.id && p.uid === uid)) { s++; continue }
    if (s === 0 && phase(r) === 'pick') continue;
    break;
  }
  return s;
}

/* ---------- topic queue + daily rounds ---------- */
const queue = () => S.topics.filter(t => t.status === 'approved').sort((a, b) => (a.order || 0) - (b.order || 0));
const pendingTopics = () => S.topics.filter(t => t.status === 'pending').sort((a, b) => a.createdAt - b.createdAt);
function startOf(d) { const x = new Date(d); x.setHours(S.settings.startHour, 0, 0, 0); return x.getTime() }
function nextAutoTime() {
  const t = new Date(), id = dayId(t);
  if (S.rounds.some(r => r.id === id) || now() >= startOf(t)) { const n = new Date(t); n.setDate(n.getDate() + 1); return startOf(n) }
  return startOf(t);
}
const attempted = {};
async function ensureToday() {
  if (!ready || !S.loaded.rounds || !S.loaded.topics || !S.loaded.settings) return;
  const today = new Date(), st = startOf(today);
  if (now() < st) return;
  const id = dayId(today);
  if (S.rounds.some(r => r.id === id) || attempted[id]) return;
  attempted[id] = true;
  const head = queue()[0];
  let topic, metric2, funny, tref = null;
  if (head) { topic = head.text; metric2 = head.metric2 || DEFAULT_M.m; funny = head.funny !== false; tref = db.doc('topics/' + head.id) }
  else {
    const used = new Set(S.rounds.map(r => r.topic));
    const pool = SUGGEST.filter(s => !used.has(s.t)); const list = pool.length ? pool : SUGGEST;
    const s = list[hash(id) % list.length]; topic = s.t; metric2 = s.m; funny = s.f;
  }
  const pe = st + S.settings.pickHours * 3600e3;
  const rref = db.doc('rounds/' + id);
  try {
    await db.runTransaction(async t => {
      const rs = await t.get(rref);
      if (rs.exists) return;
      if (tref) { const ts = await t.get(tref); if (!ts.exists || ts.data().status !== 'approved') throw new Error('stale') }
      t.set(rref, { topic, metric2, funny, auto: true, by: 'auto', createdAt: st, pickEnds: pe, rateEnds: pe + S.settings.rateHours * 3600e3 });
      if (tref) t.update(tref, { status: 'used', usedOn: id });
    });
  } catch (e) { setTimeout(() => { attempted[id] = false }, 20000) }
}

/* ---------- rendering ---------- */
function schedule() {
  const a = document.activeElement;
  if (a && app.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { pending = true } else render();
  ensureToday();
}
app.addEventListener('focusout', () => { if (!pending) return; setTimeout(() => { const a = document.activeElement; if (pending && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) { pending = false; render() } }, 0) });

function nav() {
  const tab = (n, t) => `<button class="tab ${view.name === n ? 'on' : ''}" data-act="go" data-v="${n}">${t}</button>`;
  const np = pendingTopics().length;
  const mid = isAdmin()
    ? `<button class="btn add" data-act="go" data-v="admin">ניהול${np ? ' (' + np + ')' : ''}</button>`
    : `<button class="btn add" data-act="go" data-v="suggest">+ הצע נושא</button>`;
  return `<nav class="nav"><div class="in">${tab('home', 'סבבים')}${mid}${tab('board', 'טבלה')}</div></nav>`;
}
function render() {
  pending = false;
  if (fatal) { app.innerHTML = `<div class="empty"><div class="display">PeakTheVibe</div><p class="muted">${esc(fatal)}</p></div>`; return }
  const L = S.loaded;
  if (!ready || !L.players || !L.rounds || !L.topics || !L.admin || !L.settings) { app.innerHTML = '<p class="muted" style="padding-top:40px;text-align:center">טוען…</p>'; return }
  if (!S.players[me]) { app.innerHTML = nickView(); return }
  let body = '', rateBar = false;
  const v = view.name;
  if (v === 'round') { const r = S.rounds.find(x => x.id === view.v); if (r) { body = roundView(r); rateBar = phase(r) === 'rate' } else body = homeView() }
  else if (v === 'new' && isAdmin()) body = newView();
  else if (v === 'admin' && isAdmin()) body = adminView();
  else if (v === 'suggest') body = suggestView();
  else if (v === 'board') body = boardView();
  else if (v === 'profile') body = profileView(view.v);
  else body = homeView();
  app.innerHTML = body + (rateBar ? '' : nav());
}

    else if (ph === 'rate') { pill = '<span class="pill rate">מדרגים</span>'; c = 'var(--mint)'; info = `<span data-ends="${r.rateEnds}">${fmtLeft(r.rateEnds - now())}</span> לדירוג`; if (!rated) pill += ' <span class="pill">חסר הדירוג שלך</span>' }
    else { const w = roundData(r).rows[0]; pill = '<span class="pill">תוצאות</span>'; info = w && w.pts > 0 ? 'ניצח/ה: ' + esc(nameOf(w.uid)) : 'אין ניקוד'; c = 'var(--line)' }
    return `<button class="round" style="--c:${c}" data-act="open" data-v="${esc(r.id)}"><span class="display">${esc(r.topic)}</span><span class="meta"><span>${pill}</span><span>${info}</span></span><span class="meta" style="margin-top:4px"><span>${picks.length} שירים</span><span>${fmtDate(r.createdAt)}</span></span></button>`;
  };
  return head + nextLine + (open.length ? `<h2>פתוחים עכשיו</h2>` + open.map(row).join('') : '') + (done.length ? `<h2>הסתיימו</h2>` + done.map(row).join('') : '');
}

  } finally { busy = false; render() }
}

  else if (a === 'guess') { const d = rateDraft[view.v]; const u = b.dataset.u; d.guesses[u] = d.guesses[u] === b.dataset.g ? null : b.dataset.g; if (!d.guesses[u]) delete d.guesses[u]; render() }
  else if (a === 'saverate') {
    const r = S.rounds.find(x => x.id === view.v); if (!r || phase(r) !== 'rate') { toast('זמן הדירוג נגמר'); render(); return }
    const d = rateDraft[r.id], scores = {}, guesses = {};
    S.picks.filter(p => p.rid === r.id && p.uid !== me).forEach(p => {
      if (d.scores[p.uid]) scores[p.uid] = { fit: d.scores[p.uid].fit || 0, fun: d.scores[p.uid].fun || 0 };
      if (d.guesses[p.uid]) guesses[p.uid] = d.guesses[p.uid];
    });
    rateDraft[r.id] = { scores: JSON.parse(JSON.stringify(scores)), guesses: { ...guesses } };
    await write(() => db.doc('ratings/' + r.id + '__' + me).set({ rid: r.id, uid: me, scores, guesses, at: now() }), 'נשמר');
  }
  else if (a === 'endpick') { const r = S.rounds.find(x => x.id === view.v); if (!r) return; const t = now(); await write(() => db.doc('rounds/' + r.id).update({ pickEnds: t, rateEnds: t + (r.rateEnds - r.pickEnds) }), 'שלב הדירוג התחיל') }
  else if (a === 'endrate') { const r = S.rounds.find(x => x.id === view.v); if (!r) return; await write(() => db.doc('rounds/' + r.id).update({ rateEnds: now() }), 'התוצאות נחשפו') }
  else if (a === 'copylist') {
    const r = S.rounds.find(x => x.id === view.v); if (!r) return;
    const ps = S.picks.filter(p => p.rid === r.id);
    const txt = r.topic + '\n' + ps.map(p => '• ' + p.title + (p.artist ? ' / ' + p.artist : '') + (safeUrl(p.url) ? ' ' + safeUrl(p.url) : '')).join('\n');
    try { await navigator.clipboard.writeText(txt); toast('הרשימה הועתקה') } catch (_) { toast('לא הצלחתי להעתיק במכשיר הזה') }
  }
});

/* ---------- clock ---------- */
let lastSig = '';
setInterval(() => {
  document.querySelectorAll('[data-ends]').forEach(el => el.textContent = fmtLeft(+el.dataset.ends - now()));
  const sig = S.rounds.map(r => r.id + phase(r)).join();
  if (sig !== lastSig) { lastSig = sig; if (ready) schedule() } else ensureToday();
}, 15000);

/* ---------- boot ---------- */
(async () => {
  if (!window.firebase) { fatal = 'לא הצלחתי לטעון את Firebase. בדוק חיבור לאינטרנט.'; render(); return }
  try { firebase.initializeApp(firebaseConfig) } catch (e) { fatal = 'ה-firebaseConfig לא תקין.'; render(); return }
  const auth = firebase.auth();
  auth.onAuthStateChanged(u => {
    if (!u || ready) return;
    me = u.uid; db = firebase.firestore(); ready = true;
    const err = e => { fatal = 'אין גישה לנתונים (' + (e && e.code || '') + '). בדוק את ה-Rules ב-Firebase.'; render() };
    db.collection('rounds').onSnapshot(s => { S.rounds = s.docs.map(x => ({ id: x.id, ...x.data() })); S.loaded.rounds = true; lastSig = S.rounds.map(r => r.id + phase(r)).join(); schedule() }, err);
    db.collection('picks').onSnapshot(s => { S.picks = s.docs.map(x => x.data()); schedule() }, err);
    db.collection('ratings').onSnapshot(s => { S.ratings = s.docs.map(x => x.data()); schedule() }, err);
    db.collection('players').onSnapshot(s => { const m = {}; s.docs.forEach(x => m[x.id] = x.data()); S.players = m; S.loaded.players = true; schedule() }, err);
    db.collection('topics').onSnapshot(s => { S.topics = s.docs.map(x => ({ id: x.id, ...x.data() })); S.loaded.topics = true; schedule() }, err);
    db.doc('config/admin').onSnapshot(s => { S.admin = s.exists ? s.data().uid : null; S.loaded.admin = true; schedule() }, err);
    db.doc('config/settings').onSnapshot(s => { if (s.exists) S.settings = { ...S.settings, ...s.data() }; S.loaded.settings = true; delete D.set; schedule() }, err);
    render();
  });
  try { await auth.signInAnonymously() }
  catch (e) { fatal = 'ההתחברות נכשלה (' + (e && e.code || '') + ').'; render() }
})();
</script>
