<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta name="description" content="PeakTheVibe נסגר לצמיתות. תודה לכל מי ששיחק ❤️">
<meta name="apple-mobile-web-app-title" content="PeakTheVibe">
<meta name="application-name" content="PeakTheVibe">
<meta property="og:url" content="https://oofek195711.github.io/PeakTheVibe/">
<meta property="og:image" content="https://oofek195711.github.io/PeakTheVibe/PeakTheVibeLogo.png">
<meta property="og:image:alt" content="PeakTheVibe">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://oofek195711.github.io/PeakTheVibe/PeakTheVibeLogo.png">
<link rel="icon" type="image/png" href="PeakTheVibeLogo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<title>PeakTheVibe · נסגר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#17122A;--ink:#F2EDFF;--muted:#A99FCB;--pink:#FF6B98;--card:#231B3B}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;min-height:100%;background:var(--bg);color:var(--ink)}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px calc(32px + env(safe-area-inset-bottom));font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-align:center;
  background:radial-gradient(120% 70% at 50% 0%,#3A2560 0%,var(--bg) 60%) fixed}
main{position:relative;z-index:1;width:100%;max-width:420px}
.bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .8s}
.bgv.on{opacity:1}
.shade{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(23,18,42,.55) 0%,rgba(23,18,42,.72) 55%,rgba(23,18,42,.9) 100%)}
.snd{position:fixed;z-index:2;top:calc(14px + env(safe-area-inset-top));left:14px;width:46px;height:46px;border:0;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.snd[hidden]{display:none}
.snd:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.logo{width:112px;height:112px;border-radius:28px;display:block;margin:0 auto 22px;filter:grayscale(.35);box-shadow:0 14px 40px rgba(0,0,0,.45);transform:rotate(-4deg)}
.stamp{display:inline-block;font-family:"Karantina",system-ui,sans-serif;font-weight:700;font-size:clamp(36px,11.5vw,78px);white-space:nowrap;line-height:.95;color:var(--pink);
  border:5px solid var(--pink);border-radius:18px;padding:10px 18px 2px;transform:rotate(-3deg);margin:0 0 30px;
  animation:stamp .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(-3deg) scale(1.8)}to{opacity:1;transform:rotate(-3deg) scale(1)}}
.thanks{background:var(--card);border-radius:22px;padding:22px 20px;font-size:20px;line-height:1.5;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .5s .45s ease-out both}
.thanks b{color:#fff;font-weight:800}
.heart{display:inline-block;animation:beat 1.4s 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
footer{margin-top:34px;color:var(--muted);font-size:13px;animation:up .5s .7s ease-out both}
@media (prefers-reduced-motion:reduce){.stamp,.thanks,footer,.heart{animation:none}}
</style>
</head>
<body>
<video class="bgv" id="bgv" src="bg.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
<div class="shade"></div>
<button class="snd" id="snd" type="button" aria-label="הפעל סאונד" hidden>🔇</button>
<main>
  <img class="logo" src="PeakTheVibeLogo.png" alt="PeakTheVibe">
  <h1 class="stamp">סגור לצמיתות!</h1>
  <p class="thanks">תודה ל<b>עומר שמואלי</b>, היחיד שהחזיק במשחק מעל יומיים <span class="heart">❤️</span></p>
  <footer>© 2026 PeakTheVibe. כל הזכויות שמורות לאופק טלקר.<br>גרסה 1.5.4</footer>
</main>
<script>
(function () {
  var v = document.getElementById('bgv'), b = document.getElementById('snd');
  // Show the video only once it actually plays; if bg.mp4 is missing the page stays as before.
  v.addEventListener('playing', function () { v.classList.add('on'); b.hidden = false });
  function gone() { v.remove(); b.remove() }
  if (v.error) gone(); else v.addEventListener('error', gone);
  var p = v.play(); if (p && p.catch) p.catch(function () {});
  b.addEventListener('click', function () {
    v.muted = !v.muted; if (!v.muted) v.play();
    b.textContent = v.muted ? '🔇' : '🔊';
    b.setAttribute('aria-label', v.muted ? 'הפעל סאונד' : 'השתק');
  });
})();
</script>
</body>
</html>
